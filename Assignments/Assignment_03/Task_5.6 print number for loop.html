<!--  for loop to print numbers from 1 to 10. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop</title>
</head>
<body>
    <script>
        var num=0;
        for(let i=num; i<=10; i++)
            {
            document.write("<br>", num+i);
                
            }

    </script>
</body>
</html>
