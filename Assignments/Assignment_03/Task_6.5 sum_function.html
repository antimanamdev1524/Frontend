<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum_function</title>
</head>
<body>
    <script>
        let sum = function (A, B)
        {
            return A+B;
        }
        let res = sum(10, 10);
        document.write("<br>" + "sum is:", res);
    </script>

</body>
</html>
