<!-- 	
 Create a simple webpage with a button that, 
 when clicked, 
 displays an alert saying "Button clicked!" 
 using JavaScript event listeners. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button event</title>
</head>
<body>
</body>

    <div>
        <button onclick="showalert()"> click here </button>
        <script>
            function showalert()
            {
                alert("button clicked!");
            }
        </script>
    </div>

</body>
</html>
