<!-- uses a while loop to sum all even numbers between 1 and 20.   -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even_sum</title>
</head>
<body>
    <script>
        var i=1;
        var sum=0;
        while(i<=20)
        {
            if(i%2==0)
            {
                sum=sum+i;
            }
            
            i++;
        }
        
        document.write("sum of all even numbers b/w 1 to 20 is:", sum);
    </script>
</body>
</html>
