<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>
<body>
    <script>
        let person = {
            name: "Martin",
            age: 40
        };

        //access
        document.write("name:", person.name + "<br>");
        document.write("age:", person.age + "<br>");

        //update
        person.age = 55;
        document.write("new age: ", person.age);
    </script>
</body>
</html>
