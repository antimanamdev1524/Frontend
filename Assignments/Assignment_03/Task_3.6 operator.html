<!-- a)	Add, subtract, multiply, and divide two numbers using arithmetic operators.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operators</title>
</head>
<body>
    <script>
        a=50;
        b=4;

        document.write("a+b= ", a+b + "<br>");
        document.write("a-b=", a-b + "<br>");
        document.write("a*b=", a*b + "<br>");
        document.write("a/b=", a/b + "<br>");
    </script>

    <script>
        a= 5;
        b=4;

        if(a==b)
            {
                document.write("a & b are equal");
            }
        else if (a>=b) 
            {
                document.write("a is greater than b");
            } 
        else {
                document.write("b is greater than a");
            }

    </script>


<!-- c)	Use logical operators to check if both conditions (e.g., a > 10 and b < 5) are true. -->
    <script>
        a=45;
        b=45;

        document.write("<br>", a > 10 && b < 5);   //easy way
        
        if( a > 10 && b < 5)    //check by condition
            {
                document.write("<br>" + true);
            }
        else
            {
                document.write("<br> " +false);
            }
    </script>
</body>
</html>
