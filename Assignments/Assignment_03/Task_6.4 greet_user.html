<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>greet</title>
</head>
<body>
     <script>
        function greet(name)   //'name' is a parameter
        {
            document.write("hello, " + name + "<br>");
        }
        greet ("John!");  //here 'John' is an argument (actual value)
    </script>
</body>
</html>
